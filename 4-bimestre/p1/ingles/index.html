<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Pedro's English Adventure</title><meta name="theme-color" content="#15204a"><style>
*{box-sizing:border-box}body{margin:0;color:#fff;font-family:system-ui,Arial;background:radial-gradient(circle at top,#365abe,#111936 65%);min-height:100dvh}main{max-width:850px;margin:auto;padding:20px 16px 60px}.header{display:flex;justify-content:space-between;gap:10px;align-items:center}.badge{background:#233f88;border:1px solid #7597ff;padding:9px 13px;border-radius:40px;font-weight:800}.hero{text-align:center;padding:30px 5px 20px}h1{font-size:clamp(35px,8vw,65px);line-height:1.02;margin:10px 0;color:#ffda52;text-shadow:0 5px #805213,2px 7px #121f40}.subtitle{color:#d9e6ff}.worlds{display:grid;grid-template-columns:repeat(2,1fr);gap:15px}.tile,.panel{background:#1d3369;border:2px solid #719af6;border-radius:22px;box-shadow:0 7px #0c1436}.tile{color:#fff;text-align:left;padding:18px;cursor:pointer;min-height:180px}.tile strong{display:block;font-size:21px;margin:10px 0}.tile span{font-size:42px}.tile small{color:#c4d9ff}.tile em{display:block;margin-top:12px;color:#ffdb59;font-style:normal}.panel{padding:22px}.bar{height:13px;border-radius:30px;background:#101c47;overflow:hidden;margin:20px 0}.fill{height:100%;width:0;background:linear-gradient(90deg,#38ef9f,#fee55b)}.visual{text-align:center;font-size:85px;margin:20px 0}.question{font-size:clamp(24px,5vw,35px);font-weight:900;line-height:1.18}.choices{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:25px 0}.choice{min-height:70px;border-radius:17px;border:2px solid #789dff;background:#304e99;color:white;font-size:19px;font-weight:800;padding:12px;cursor:pointer}.choice.active{border-color:#ffdb51}.choice.good{background:#176c57;border-color:#50ef93}.choice.bad{background:#7c304e;border-color:#ffa3a3}.btn{border:0;border-radius:16px;background:#ffdc53;color:#171e3b;padding:16px 22px;font-size:17px;font-weight:900;cursor:pointer}.btn:disabled{opacity:.4}.muted{background:#395cac;color:#fff}.actions{display:flex;justify-content:space-between;gap:12px}.feedback{background:#13275c;border-left:5px solid #ffda57;padding:15px;margin-bottom:18px;border-radius:8px}.hidden{display:none}.review{background:#0d1b46;border-radius:12px;margin:10px 0;padding:14px}.center{text-align:center}.tiny{font-size:13px;color:#c4d5fa}@media(max-width:530px){.worlds,.choices{grid-template-columns:1fr}.tile{min-height:115px}.panel{padding:16px}.visual{font-size:68px}}</style></head><body><main><div class="header"><div class="badge">🎮 PEDRO • UNIT 7</div><div class="badge" id="total">⭐ 0 XP</div></div><section id="home"><div class="hero"><div style="font-size:75px">🏝️🚗✈️🚦</div><h1>PEDRO'S ENGLISH<br>ADVENTURE</h1><p class="subtitle">Aventura de transportes, ações e segurança no trânsito</p></div><div class="worlds" id="worlds"></div><p class="tiny center">Sem cadastro e anúncios. Seus recordes ficam apenas neste dispositivo.</p></section><section id="game" class="hidden"><div class="hero"><div style="font-size:50px" id="symbol"></div><h2 id="title"></h2><div id="subtitle" class="subtitle"></div></div><div class="panel"><div class="header"><div class="badge" id="counter"></div><div class="badge" id="xp"></div></div><div class="bar"><div class="fill" id="fill"></div></div><div class="visual" id="visual"></div><div class="question" id="question"></div><p class="subtitle">Escolha uma opção:</p><div class="choices" id="choices"></div><div class="feedback hidden" id="feedback"></div><div class="actions"><button class="btn muted" id="leave">⌂ Mundos</button><button class="btn" id="confirm" disabled>Confirmar ✓</button></div></div></section><section id="result" class="hidden"><div class="hero"><div style="font-size:82px">🏆</div><h1>MISSÃO COMPLETA!</h1><p id="stats" class="subtitle"></p></div><div class="panel"><h2>O que revisar</h2><div id="mistakes"></div><div class="actions"><button class="btn muted" id="menu">⌂ Mundos</button><button class="btn" id="again">Continuar ➜</button></div></div></section></main><script>
const transport=[
['✈️','What is this?',['Plane','Boat','Bus','Train'],0,'Plane = avião.'],
['🚁','What is this?',['Train','Helicopter','Truck','Plane'],1,'Helicopter = helicóptero.'],
['🚌','What is this?',['Bus','Boat','Truck'],0,'Bus = ônibus.'],
['🚚','What is this?',['Bus','Truck','Train'],1,'Truck = caminhão.'],
['🏍️','What is this?',['Motorcycle','Helicopter','Plane'],0,'Motorcycle = motocicleta.'],
['🚂','What is this?',['Boat','Train','Bus'],1,'Train = trem.'],
['⛵','What is this?',['Boat','Truck','Bus'],0,'Boat = barco.'],
['🚗','What does DRIVE mean?',['Voar','Dirigir','Velejar'],1,'Drive = dirigir.'],
['✈️','What does FLY mean?',['Velejar','Voar','Dirigir'],1,'Fly = voar.'],
['⛵','What does SAIL mean?',['Velejar','Voar','Dirigir'],0,'Sail = velejar.']];
const actions=[
['🚗','What’s she doing?',['She’s driving.','She’s flying.','She’s sailing.'],0,'She’s driving = ela está dirigindo.'],
['✈️','Is she flying a plane?',['Yes, she is.','No, she isn’t.'],0,'Yes, she is = sim, ela está.'],
['🚗','Is she flying a plane?',['Yes, she is.','No, she isn’t.'],1,'Não: a imagem mostra um carro.'],
['⛵','What’s he doing?',['He’s driving.','He’s sailing.','He’s flying.'],1,'He’s sailing = ele está velejando.'],
['🚁','What’s she doing?',['She’s sailing.','She’s flying.','She’s driving.'],1,'She’s flying = ela está voando.'],
['🚗','Complete: She ___ driving.',['are','is','am'],1,'She is driving.'],
['🏍️','Is he riding a motorcycle?',['Yes, he is.','No, he isn’t.'],0,'Yes, he is.'],
['🚗','Complete: What’s she ___?',['do','doing','does'],1,'What’s she doing?'],
['🚗','Choose the correct sentence.',['She driving.','She’s driving.','She drive.'],1,'She’s = she is.'],
['🚂','Is he sailing a boat?',['Yes, he is.','No, he isn’t.'],1,'Não: a imagem é de um trem.']];
const traffic=[
['🔒','Seat belt means...',['Cinto de segurança','Calçada','Placa'],0,'Seat belt = cinto de segurança.'],
['🚶','Sidewalk means...',['Trânsito','Calçada','Faixa de pedestres'],1,'Sidewalk = calçada.'],
['🚦','What is this?',['Traffic light','Seat belt','Sign'],0,'Traffic light = semáforo.'],
['🚸','Crosswalk means...',['Calçada','Faixa de pedestres','Trânsito'],1,'Crosswalk = faixa de pedestres.'],
['🛑','Sign means...',['Placa','Trem','Cinto'],0,'Sign = placa.'],
['🚗🚕','Traffic means...',['Calçada','Trânsito','Avião'],1,'Traffic = trânsito.'],
['🚶','Complete: Walk on the ___.',['sign','sidewalk','seat belt'],1,'Ande na calçada.'],
['🚦','Complete: Traffic ___.',['light','boat','truck'],0,'Traffic light = semáforo.'],
['🚸','Where do we cross the road?',['At the crosswalk','In a train','On a plane'],0,'At the crosswalk = na faixa de pedestres.'],
['🚗','Complete: Wear a seat ___.',['belt','sign','walk'],0,'Wear a seat belt = use cinto.']];
const boss=[
['🚚','Choose the word for CAMINHÃO.',['Boat','Truck','Train'],1,'Truck = caminhão.'],
['🚦','Traffic light means...',['Semáforo','Barco','Cinto'],0,'Traffic light = semáforo.'],
['🚗','What’s she doing?',['She’s flying.','She’s driving.','She’s sailing.'],1,'She’s driving.'],
['🚁','Choose the correct word.',['Helicopter','Motorcycle','Truck'],0,'Helicopter = helicóptero.'],
['🚸','Crosswalk means...',['Calçada','Faixa de pedestres','Trânsito'],1,'Crosswalk = faixa de pedestres.'],
['⛵','What’s he doing?',['He’s sailing.','He’s driving.','He’s flying.'],0,'He’s sailing.'],
['🚌','Bus means...',['Caminhão','Ônibus','Trem'],1,'Bus = ônibus.'],
['🚶','Walk on the ___.',['sidewalk','truck','seat belt'],0,'Sidewalk = calçada.'],
['✈️','Fly means...',['Dirigir','Velejar','Voar'],2,'Fly = voar.'],
['🚗','Complete: She ___ driving.',['is','are','am'],0,'She is driving.'],
['🛑','This is a...',['sign','boat','train'],0,'Sign = placa.'],
['🚂','Train means...',['Avião','Trem','Helicóptero'],1,'Train = trem.'],
['🚗','Is she driving a car?',['Yes, she is.','No, she isn’t.'],0,'Sim: ela está dirigindo um carro.'],
['🔒','Wear your seat ___.',['light','belt','walk'],1,'Seat belt.'],
['🏍️','Motorcycle means...',['Motocicleta','Caminhão','Ônibus'],0,'Motorcycle = motocicleta.'],
['🚗🚕','Traffic means...',['Faixa de pedestres','Trânsito','Calçada'],1,'Traffic = trânsito.'],
['⛵','Sail means...',['Voar','Dirigir','Velejar'],2,'Sail = velejar.'],
['🚁','Is he driving a boat?',['Yes, he is.','No, he isn’t.'],1,'Não: a imagem é de helicóptero.'],
['🚗','Drive means...',['Dirigir','Voar','Velejar'],0,'Drive = dirigir.'],
['💬','Choose the correct question.',['What she doing?','What’s she doing?','She what doing?'],1,'What’s she doing?']];
const worlds=[['🚘✈️','Transportation City','10 perguntas · Livro p. 94',transport],['🕹️💬','Action Challenge','10 perguntas · Livro p. 95',actions],['🚦🛑','Traffic Safety Obby','10 perguntas · Livro p. 100',traffic],['👑🏆','Final Boss','20 perguntas · Simulado final',boss]];
const el=id=>document.getElementById(id);let records={};try{records=JSON.parse(localStorage.getItem('pedro-unit7')||'{}')}catch(e){}let w=0,n=0,pick=-1,checked=false,hits=0,wrong=[];
function screen(id){['home','game','result'].forEach(x=>el(x).classList.toggle('hidden',id!==x));window.scrollTo(0,0)}
function menu(){el('worlds').innerHTML='';worlds.forEach((x,i)=>{let b=document.createElement('button');b.className='tile';b.innerHTML='<span>'+x[0]+'</span><strong>Mundo '+(i+1)+' — '+x[1]+'</strong><small>'+x[2]+'</small><em>'+(records[i]!==undefined?'🏅 Recorde: '+records[i]+'/'+x[3].length:'▶ Começar missão')+'</em>';b.onclick=()=>start(i);el('worlds').append(b)});el('total').textContent='⭐ '+Object.values(records).reduce((a,b)=>a+b*10,0)+' XP';screen('home')}
function start(i){w=i;n=0;hits=0;wrong=[];screen('game');render()}
function render(){let x=worlds[w],q=x[3][n];el('symbol').textContent=x[0];el('title').textContent=x[1];el('subtitle').textContent=x[2];el('counter').textContent='Questão '+(n+1)+'/'+x[3].length;el('xp').textContent='⭐ '+hits*10+' XP';el('fill').style.width=(n/x[3].length*100)+'%';el('visual').textContent=q[0];el('question').textContent=q[1];el('feedback').classList.add('hidden');el('choices').innerHTML='';pick=-1;checked=false;el('confirm').disabled=true;el('confirm').textContent='Confirmar ✓';q[2].forEach((a,i)=>{let b=document.createElement('button');b.className='choice';b.textContent=String.fromCharCode(65+i)+'. '+a;b.onclick=()=>{if(checked)return;pick=i;[...el('choices').children].forEach((c,j)=>c.classList.toggle('active',i===j));el('confirm').disabled=false};el('choices').append(b)})}
function answer(){let x=worlds[w],q=x[3][n];if(!checked){if(pick<0)return;checked=true;let ok=pick===q[3];if(ok)hits++;else wrong.push(q);[...el('choices').children].forEach((b,i)=>{b.disabled=true;if(i===q[3])b.classList.add('good');else if(i===pick)b.classList.add('bad')});el('feedback').textContent=(ok?'✅ Excellent! +10 XP. ':'💡 Vamos revisar! ')+q[4];el('feedback').classList.remove('hidden');el('confirm').textContent=n===x[3].length-1?'Ver resultado 🏆':'Próxima ➜'}else{n++;if(n===x[3].length)finish();else render()}}
function finish(){if(records[w]===undefined||hits>records[w]){records[w]=hits;try{localStorage.setItem('pedro-unit7',JSON.stringify(records))}catch(e){}}el('stats').textContent=hits+' de '+worlds[w][3].length+' acertos · '+hits*10+' XP';el('mistakes').innerHTML=wrong.length?'':'<p>🎉 Tudo certo! Parabéns, Pedro!</p>';wrong.forEach(q=>{let d=document.createElement('div');d.className='review';d.textContent=q[1]+' — Resposta: '+q[2][q[3]]+'. '+q[4];el('mistakes').append(d)});el('again').textContent=w===3?'Repetir final boss ↺':'Próxima missão ➜';screen('result')}
el('confirm').onclick=answer;el('leave').onclick=menu;el('menu').onclick=menu;el('again').onclick=()=>start(w===3?3:w+1);menu();
</script></body></html>
